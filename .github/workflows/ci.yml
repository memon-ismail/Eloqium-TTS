name: Eloqium TTS CI & Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK & Build Tools
        run: |
          sdkmanager --install "ndk;26.1.10909125" "build-tools;35.0.0" "platforms;android-36"

      - name: Set NDK Environment
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/26.1.10909125" >> $GITHUB_ENV

      - name: Grant Execute Permissions
        run: |
          chmod +x gradlew native/build-native.sh

      - name: Build Native Libraries (arm64-v8a, armeabi-v7a, x86_64)
        env:
          ABIS: "arm64-v8a armeabi-v7a x86_64"
          LANGS: "lang/enus lang/engb lang/eses lang/esus lang/frfr lang/frca lang/dede lang/itit"
        run: |
          ./native/build-native.sh

      - name: Verify 16 KB Page-Size ELF Alignment
        run: |
          echo "Verifying arm64-v8a LOAD segment alignment:"
          readelf -l app/build/native/jniLibs/arm64-v8a/libeloqiumjni.so | grep -A 2 LOAD

      - name: Decode Persistent Release Keystore
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > release_key.jks
          fi

      - name: Assemble Production Release APK
        env:
          RELEASE_KEYSTORE_PATH: "release_key.jks"
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease --stacktrace

      - name: Clean Keystore From Workspace
        if: always()
        run: |
          rm -f release_key.jks

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: eloqium-tts-release-apk
          path: app/build/outputs/apk/release/*.apk
